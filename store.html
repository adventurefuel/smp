<style>
:root{--black:#0b0b0b;--ink:#161616;--line:#2a2a2a;--white:#fff;--warm:#f7f5f1;--gray:#6c6c6c;--lgray:#e8e5df;--gold:#e8b351;--gold-deep:#a6730f;--green:#25D366;--red:#c0392b;--blue:#2f6fb5}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Inter',Arial,Helvetica,sans-serif;background:var(--warm);color:var(--black);line-height:1.5;padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.wrap{width:min(100% - 28px,980px);margin:0 auto}
.top{position:sticky;top:0;z-index:50;background:var(--black);color:var(--white);border-bottom:1px solid rgba(232,179,81,.45);padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand img{height:42px;width:auto}
.brand b{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600}
.nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.nav a{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;color:#ddd;padding:8px 6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 18px;border:1px solid var(--gold);background:var(--gold);color:var(--black);font-weight:600;font-size:.82rem;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;text-decoration:none;border-radius:2px}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:transparent;color:var(--black);border-color:#bdb8ae}
.top .btn.ghost{color:#eee;border-color:#555}
.btn.sm{min-height:38px;padding:7px 12px;font-size:.72rem}
.btn.wa{background:var(--green);border-color:var(--green)}
.btn.danger{background:transparent;border-color:#d9a79f;color:var(--red)}
.btn.ok{background:var(--black);border-color:var(--black);color:var(--white)}
.linkbtn{background:none;border:0;padding:4px 2px;text-decoration:underline;cursor:pointer;font-size:.8rem;color:var(--gray)}
.loading{padding:70px 0;text-align:center;color:var(--gray)}
.note{font-size:.82rem;color:var(--gray)}
/* auth */
.authbox{max-width:400px;margin:44px auto;background:var(--white);border:1px solid var(--lgray);padding:30px 26px;box-shadow:0 14px 38px rgba(0,0,0,.08)}
.authbox h1{margin:0 0 6px;font-size:1.55rem;font-weight:800;letter-spacing:-.02em}
.authbox label{display:block;margin:14px 0 6px;font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.authbox input{width:100%;padding:13px;border:1px solid #cfcfcf;background:#fff;border-radius:0;outline:none}
.authbox input:focus,.field:focus{border-color:var(--gold);box-shadow:0 0 0 2px rgba(232,179,81,.25)}
.authbox .btn{width:100%;margin-top:20px}
.tabs2{display:flex;gap:6px;margin-bottom:6px}
.tabs2 button{flex:1;padding:10px;border:0;border-bottom:2px solid var(--lgray);background:none;font-weight:600;font-size:.82rem;cursor:pointer;color:var(--gray)}
.tabs2 button.on{border-color:var(--gold);color:var(--black)}
.err{margin-top:14px;padding:10px 12px;background:#fdecea;border:1px solid #f1b5ad;color:#8a2a1f;font-size:.84rem}
.okbox{margin-top:14px;padding:10px 12px;background:#eaf6ee;border:1px solid #a9d8b8;color:#1d5a33;font-size:.84rem}
/* alerts */
.alerts{margin:18px 0 6px;padding:14px 16px;background:var(--black);color:#eee;border:1px solid rgba(232,179,81,.5);display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;font-size:.84rem}

.alerts .note{color:#aaa}
.alerts.on{background:#fff;color:var(--black);border-color:var(--lgray)}

.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.78rem;word-break:break-all;background:#f4f1ea;border:1px solid var(--lgray);padding:8px 10px;margin-top:6px;user-select:all}
.tl.bot div{border-left:3px solid var(--gold);padding-left:8px}
.keyrow.off{opacity:.5}
.warnbox{margin:18px 0 6px;padding:12px 14px;background:#fff6e0;border:1px solid #ecd28c;font-size:.84rem}

.stat{background:#fff;border:1px solid var(--lgray);padding:14px 14px 12px}
.stat span{display:block;font-size:.64rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--gray)}
.stat b{display:block;font-size:1.55rem;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.stat.hot b{color:var(--gold-deep)}
/* tabs */
.tabs{display:flex;gap:2px;margin:10px 0 14px;border-bottom:1px solid var(--lgray);overflow-x:auto;scrollbar-width:none}
.tabs button{padding:12px 9px;border:0;border-bottom:3px solid transparent;background:none;font-weight:600;font-size:.82rem;cursor:pointer;color:var(--gray);white-space:nowrap}
.tabs button.on{border-color:var(--gold);color:var(--black)}
.tabs i{font-style:normal;display:inline-block;min-width:20px;margin-left:6px;padding:1px 6px;background:var(--gold);color:var(--black);border-radius:10px;font-size:.7rem}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chips button{padding:7px 13px;border:1px solid #cfc9bd;background:#fff;border-radius:20px;font-size:.78rem;font-weight:600;cursor:pointer}
.chips button.on{background:var(--black);border-color:var(--black);color:#fff}
/* cards */
.card{background:#fff;border:1px solid var(--lgray);padding:16px 16px 14px;margin-bottom:12px}
.card.fresh{border-color:var(--gold);box-shadow:0 0 0 2px rgba(232,179,81,.25)}
.card .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.card h3{margin:0;font-size:1.05rem;font-weight:700}
.card .meta{font-size:.78rem;color:var(--gray)}
.badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:.66rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--lgray);color:#444}
.badge.new{background:var(--gold);color:var(--black)}
.badge.confirmed{background:#dbe9f7;color:#1d4d82}
.badge.completed,.badge.paid{background:#dcf1e3;color:#1d5a33}
.badge.cancelled,.badge.no_show{background:#f6dcd8;color:#8a2a1f}
.badge.type{background:var(--black);color:var(--gold)}
.svc{margin:8px 0 2px;font-weight:600}
.svc em{font-style:normal;color:var(--gold-deep)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:10px 0;font-size:.88rem}
.kv span{color:var(--gray)}
.kv b{font-weight:500;word-break:break-word}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
textarea.field,input.field,select.field{width:100%;padding:10px 11px;border:1px solid #cfcfcf;background:#fff;border-radius:0;outline:none;font-size:.9rem}
textarea.field{min-height:56px;resize:vertical}
.empty{padding:40px 10px;text-align:center;color:var(--gray);border:1px dashed #cfc9bd;background:#fff}
/* services editor */
.svc-ed{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin-top:10px}
.svc-ed label{display:block;font-size:.66rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--gray);margin-bottom:4px}
.svc-ed .full{grid-column:1/-1}
.toasts{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;z-index:200;pointer-events:none;align-items:center}
.toast{pointer-events:auto;max-width:460px;width:100%;background:var(--black);color:#fff;padding:12px 15px;border-left:4px solid var(--gold);font-size:.88rem;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast small{display:block;font-weight:400;color:#ccc;margin-top:2px}
/* CRM */
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
.bar input.field{flex:1;min-width:180px}
.card.click{cursor:pointer}
.card.click:hover{border-color:var(--gold)}
.row{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--lgray);font-size:.88rem;cursor:default}
.row[data-open-client]{cursor:pointer}
.row .when{flex:0 0 auto;min-width:72px;font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--gold-deep)}
.row .when.late,.late{color:var(--red);font-weight:700}
.row .linkbtn{margin-left:auto}
.dayhd{margin:18px 0 8px;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gray)}
.vrow h3{font-size:1rem}
.vrow h3 .meta{font-weight:400}
.badge.st-lead{background:var(--gold);color:var(--black)}
.badge.st-contacted{background:#dbe9f7;color:#1d4d82}
.badge.st-consult_booked{background:#e6dcf5;color:#4b2d7f}
.badge.st-session_1,.badge.st-session_2{background:#fde3c4;color:#8a4a0a}
.badge.st-complete{background:#dcf1e3;color:#1d5a33}
.badge.st-not_a_fit{background:#eee;color:#777}
.badge.v-scheduled{background:#dbe9f7;color:#1d4d82}
.badge.v-completed{background:#dcf1e3;color:#1d5a33}
.badge.v-cancelled,.badge.v-no_show{background:#f6dcd8;color:#8a2a1f}
.cal{background:#fff;border:1px solid var(--lgray);padding:10px 12px 12px;margin-bottom:14px;max-width:420px}
.calhd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.calhd .linkbtn{font-size:1.4rem;text-decoration:none;padding:2px 10px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.calgrid span{font-size:.64rem;font-weight:700;color:var(--gray);padding:2px 0}
.calgrid button{position:relative;min-height:40px;border:1px solid transparent;background:none;border-radius:4px;font-size:.84rem;cursor:pointer}
.calgrid button.today{border-color:var(--gold)}
.calgrid button.sel{background:var(--black);color:#fff}
.calgrid button u{position:absolute;right:3px;top:2px;text-decoration:none;font-size:.58rem;font-weight:800;background:var(--gold);color:var(--black);border-radius:8px;padding:0 5px}
.tl{padding:8px 0;border-top:1px solid var(--lgray);font-size:.88rem}
.tl span{display:block;font-size:.7rem;color:var(--gray)}
.tl.event div{color:var(--gray);font-size:.82rem}
dialog.modal{border:1px solid var(--gold);padding:22px 20px 18px;width:min(560px,94vw);max-height:92vh;overflow:auto;background:#fff;color:var(--black)}
dialog.modal::backdrop{background:rgba(0,0,0,.6)}
dialog.modal h3{margin:0 0 4px;font-size:1.2rem}
.mclose{position:absolute;top:6px;right:8px;width:40px;height:40px;border:0;background:none;font-size:1.6rem;cursor:pointer;color:var(--gray)}
.errline{min-height:1.2em;margin-top:10px;font-size:.84rem;color:var(--red);font-weight:600}
@media(max-width:640px){.stats{grid-template-columns:1fr 1fr}.svc-ed{grid-template-columns:1fr}.nav a.hide-sm{display:none}}
</style>
</head>

<script>
const CFG={

  VAPID_PUBLIC:'BBhfctT3gn-NwAVFWL4--gEWyjhHsOTX1_vzfbeSAZetfTnfmXyipG4XKrrKoSQtg20LKoGQW1NWprjWCQle4qQ',
  WA_NUMBER:'15865535504'
};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2});
const errMsg=e=>(e&&(e.message||e.error_description||e.msg))||'Something went wrong. Check your connection and try again.';
const sb=window.supabase.createClient(CFG.URL,CFG.KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const V=()=>$('#view');
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;

function toast(msg,sub){const el=document.createElement('div');el.className='toast';el.innerHTML=esc(msg)+(sub?`<small>${esc(sub)}</small>`:'');$('#toasts').appendChild(el);setTimeout(()=>el.remove(),6500)}
const dayLabel=d=>d?new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}):'';
const ago=ts=>{const s=(Date.now()-new Date(ts))/1000;if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+' min ago';if(s<86400)return Math.floor(s/3600)+' hr ago';return new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric'})};
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const smsLink=(phone,msg)=>'sms:+1'+String(phone).replace(/\D/g,'').slice(-10)+'?&body='+encodeURIComponent(msg);
const waLink=(phone,msg)=>'https://wa.me/1'+String(phone).replace(/\D/g,'').slice(-10)+'?text='+encodeURIComponent(msg);
const first=n=>String(n||'').trim().split(/\s+/)[0]||'there';

/* ---------- state ---------- */
let user=null,A={appts:[],orders:[],offers:[],subs:[],subsErr:null,clients:[],visits:[],payments:[],crmErr:null,agentKeys:[],agentHook:null,agentErr:null},tab=(location.hash.replace('#','')||'appointments'),fAppt='new',fOrd='new',channel=null,swReg=null,fresh=new Set();
if(!['appointments','schedule','clients','purchases','referrals','subscribers','bot','services'].includes(tab))tab='appointments';

/* ---------- service worker + push ---------- */
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').then(r=>{swReg=r;refreshPush()}).catch(()=>{});
  navigator.serviceWorker.addEventListener('message',e=>{if(e.data?.type==='push'&&document.visibilityState==='visible')reloadData()});
}
const b64ToU8=b=>{const p='='.repeat((4-b.length%4)%4),s=(b+p).replace(/-/g,'+').replace(/_/g,'/'),r=atob(s);return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))};
/* The service worker can fail to register (blocked, private mode, unsupported host). Never let that
   block the dashboard: wait a few seconds for it, then fall back to "no alerts on this device". */
async function getReg(){
  if(swReg)return swReg;
  try{return await Promise.race([navigator.serviceWorker.ready,new Promise(r=>setTimeout(()=>r(null),3000))])}catch(_){return null}
}
let ps=null;
async function refreshPush(){ps=await pushState();if(user)render()}
async function pushState(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window))return isIOS&&!standalone?'ios-install':'unsupported';
  if(isIOS&&!standalone)return'ios-install';
  if(Notification.permission==='denied')return'denied';
  try{const reg=await getReg();if(!reg)return'unsupported';const sub=await reg.pushManager.getSubscription();return sub&&Notification.permission==='granted'?'on':'off'}catch(_){return'off'}
}
const deviceLabel=()=>(isIOS?'iPhone':/android/i.test(navigator.userAgent)?'Android':'Computer')+(standalone?' app':' browser');
/* Save this device's browser subscription to the database (safe to repeat). Returns an error or null. */
async function saveSub(sub){
  const j=sub.toJSON();
  const {error}=await sb.from('push_subscriptions').upsert({endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth,user_id:user.id,label:deviceLabel()},{onConflict:'endpoint'});
  return error||null;
}
/* Self-heal: if this phone already has a browser subscription (alerts "on") but it never reached the
   database, register it now. Runs after every sign-in and right before a test alert. */
async function syncPush(){
  try{
    if(!user||!('Notification' in window)||Notification.permission!=='granted')return null;
    const reg=await getReg();if(!reg)return null;
    let sub=await reg.pushManager.getSubscription();if(!sub)return null;
    // A subscription made with a different server key can never receive our alerts: replace it.
    try{const k=sub.options&&sub.options.applicationServerKey;
      if(k&&!u8eq(new Uint8Array(k),b64ToU8(CFG.VAPID_PUBLIC))){
        await sb.from('push_subscriptions').delete().eq('endpoint',sub.endpoint);await sub.unsubscribe();
        sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToU8(CFG.VAPID_PUBLIC)});
      }}catch(_){}
    return await saveSub(sub);
  }catch(e){return e}
}
async function enablePush(){
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){toast('Alerts are blocked','Allow notifications for this app in your phone settings, then try again.');return refreshPush()}
    const reg=await getReg();if(!reg)throw new Error('The app is still starting up. Reload and try again.');
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToU8(CFG.VAPID_PUBLIC)});
    const error=await saveSub(sub);
    if(error)throw error;
    toast('Phone alerts are on','Sending a test alert now…');await refreshPush();setTimeout(testPush,600);
  }catch(e){toast('Could not turn on alerts',errMsg(e));refreshPush()}
}
let diagText='';
const u8eq=(a,b)=>a&&b&&a.length===b.length&&a.every((x,i)=>x===b[i]);
/* Explains exactly where a push is getting lost on THIS phone. */
async function diagnosePush(){
  const out=[];
  try{
    out.push('Permission: '+Notification.permission);
    const reg=await getReg();
    if(!reg){out.push('Service worker: NOT running');diagText=out.join('\n');return render()}
    out.push('Service worker: '+(reg.active?'running':'not active yet')+(navigator.serviceWorker.controller?'':' (page not controlled yet)'));
    const sub=await reg.pushManager.getSubscription();
    if(!sub)out.push('Browser subscription: none');
    else{
      let match='unknown';
      try{const k=sub.options&&sub.options.applicationServerKey;if(k)match=u8eq(new Uint8Array(k),b64ToU8(CFG.VAPID_PUBLIC))?'matches':'DOES NOT MATCH';}catch(_){}
      out.push('Browser subscription: yes ('+new URL(sub.endpoint).host+'), server key '+match);
    }
    // show a notification locally, no network involved: proves the phone can display one
    try{await reg.showNotification('Swurl Kurl local check',{body:'If you can see this, your phone can show alerts.',icon:'/img/icon-192.png',tag:'local-check'});out.push('Local notification: sent to the phone (did it appear?)')}
    catch(e){out.push('Local notification FAILED: '+errMsg(e))}
    try{
      const r=await (await caches.open('sk-diag')).match('/__lastpush');
      if(!r)out.push('Last push from server: none received yet on this phone');
      else{const j=await r.json();out.push('Last push from server: '+ago(j.t)+' — '+(j.stage==='shown'?'received and shown':j.stage==='error'?'received but could not be shown: '+j.error:'received'))}
    }catch(_){out.push('Last push from server: unknown')}
  }catch(e){out.push('Check failed: '+errMsg(e))}
  diagText=out.join('\n');render();
}
async function disablePush(){
  const reg=await getReg();const sub=reg?await reg.pushManager.getSubscription():null;
  if(sub){await sb.from('push_subscriptions').delete().eq('endpoint',sub.endpoint);await sub.unsubscribe()}
  toast('Alerts turned off on this device');refreshPush();
}
async function testPush(){
  try{
    const serr=await syncPush();
    if(serr){toast('This phone could not be registered',errMsg(serr));return}
    const {data:{session}}=await sb.auth.getSession();
    const r=await fetch(CFG.URL+'/functions/v1/notify-request',{method:'POST',headers:{'Content-Type':'application/json','apikey':CFG.KEY,'Authorization':'Bearer '+session.access_token},body:'{}'});
    const j=await r.json();
    if(!r.ok)throw new Error(j.error||'Test failed');
    if(j.sent)toast('Test alert sent',`Delivered to ${j.sent} device${j.sent>1?'s':''}.`);
    else if(j.failures&&j.failures.length)toast('Alert could not be delivered',String(j.failures[0].msg||j.failures[0].code).slice(0,140));
    else toast('No device is registered yet','Tap "Turn off here", then "Turn on phone alerts".');
  }catch(e){toast('Test alert failed',errMsg(e))}
}

let authMode='in';
function vAuth(mode,msg,kind){
  authMode=mode;$('#signout').hidden=true;
  if(mode==='newpw'){V().innerHTML=`<div class="authbox"><h1>New password</h1><label for="npw">Choose a new password</label><input id="npw" type="password" minlength="8" autocomplete="new-password"><button class="btn" id="npwgo">Save password</button><div id="amsg"></div></div>`;
    $('#npwgo').onclick=async()=>{const pw=$('#npw').value;if(pw.length<8)return $('#amsg').innerHTML='<div class="err">Use at least 8 characters.</div>';
      const {error}=await sb.auth.updateUser({password:pw});if(error)return $('#amsg').innerHTML=`<div class="err">${esc(errMsg(error))}</div>`;toast('Password updated');boot()};return}
  const up=mode==='up';
  V().innerHTML=`<div class="authbox"><div class="tabs2"><button data-m="in" class="${up?'':'on'}">Sign in</button><button data-m="up" class="${up?'on':''}">First-time setup</button></div>
   <h1>${up?'Create the owner login':'Store login'}</h1><p class="note" style="margin:0 0 4px">${up?'Use the one-time setup code you were given.':'Appointments and purchases for Swurl Kurl Studios.'}</p>
   <label for="em">Email</label><input id="em" type="email" autocomplete="email" inputmode="email">
   <label for="pw">Password</label><input id="pw" type="password" autocomplete="${up?'new-password':'current-password'}" minlength="8">
   ${up?'<label for="code">Setup code</label><input id="code" type="text" autocapitalize="characters" autocomplete="off" spellcheck="false">':''}
   <button class="btn" id="go">${up?'Create login':'Sign in'}</button>
   ${up?'':'<div style="margin-top:12px;text-align:center"><button class="linkbtn" id="forgot">Forgot password?</button></div>'}
   <div id="amsg">${msg?`<div class="${kind==='ok'?'okbox':'err'}">${esc(msg)}</div>`:''}</div></div>`;
  document.querySelectorAll('.tabs2 button').forEach(b=>b.onclick=()=>vAuth(b.dataset.m));
  const go=async()=>{
    const email=$('#em').value.trim(),pw=$('#pw').value;
    if(!email||pw.length<8)return $('#amsg').innerHTML='<div class="err">Enter your email and a password of at least 8 characters.</div>';
    $('#go').disabled=true;
    try{
      if(!up){const {error}=await sb.auth.signInWithPassword({email,password:pw});if(error)throw error;return boot()}
      const code=$('#code').value.trim();if(!code)throw new Error('Enter your setup code.');
      sessionStorage.setItem('sk_claim',code);
      const {data,error}=await sb.auth.signUp({email,password:pw,options:{emailRedirectTo:location.origin+'/store.html'}});
      if(error)throw error;
      if(data.session)return boot();
      vAuth('in','Check your email and confirm your address, then sign in here. You will be asked for your setup code once.','ok');
    }catch(e){$('#amsg').innerHTML=`<div class="err">${esc(errMsg(e))}</div>`;$('#go').disabled=false}
  };
  $('#go').onclick=go;[...document.querySelectorAll('.authbox input')].forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter')go()}));
  const f=$('#forgot');if(f)f.onclick=async()=>{const email=$('#em').value.trim();if(!email)return $('#amsg').innerHTML='<div class="err">Type your email above first.</div>';
    const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/store.html'});$('#amsg').innerHTML=error?`<div class="err">${esc(errMsg(error))}</div>`:'<div class="okbox">If that email has a login, a reset link is on its way.</div>'};
}

/* ---------- data ---------- */
async function reloadData(){
  const [a,o,s]=await Promise.all([
    sb.from('appointments').select('*').order('created_at',{ascending:false}).limit(500),
    sb.from('orders').select('*').order('created_at',{ascending:false}).limit(500),
    sb.from('offers').select('*').order('sort')]);
  if(a.error)throw a.error;if(o.error)throw o.error;if(s.error)throw s.error;
  A.appts=a.data;A.orders=o.data;A.offers=s.data;
  try{
    const [c,v,p]=await Promise.all([
      sb.from('clients').select('*').order('updated_at',{ascending:false}).limit(2000),
      sb.from('visits').select('*').order('starts_at',{ascending:true}).limit(3000),
      sb.from('payments').select('*').order('paid_on',{ascending:false}).limit(5000)]);
    const e=c.error||v.error||p.error;
    if(e){A.clients=[];A.visits=[];A.payments=[];A.crmErr=e.message||'unavailable'}else{A.clients=c.data;A.visits=v.data;A.payments=p.data;A.crmErr=null}
  }catch(e){A.clients=[];A.visits=[];A.payments=[];A.crmErr='unavailable'}
  try{const b=await sb.from('blog_subscribers').select('*').order('created_at',{ascending:false}).limit(2000);
    if(b.error){A.subs=[];A.subsErr=b.error.message||'unavailable'}else{A.subs=b.data;A.subsErr=null}}catch(e){A.subs=[];A.subsErr='unavailable'}
  try{
    const [k,h]=await Promise.all([sb.from('agent_keys').select('*').order('created_at',{ascending:false}).limit(50),sb.from('agent_webhook').select('*').eq('id',1).maybeSingle()]);
    const e=k.error||h.error;
    if(e){A.agentKeys=[];A.agentHook=null;A.agentErr=e.message||'unavailable'}else{A.agentKeys=k.data;A.agentHook=h.data;A.agentErr=null}
  }catch(e){A.agentKeys=[];A.agentHook=null;A.agentErr='unavailable'}
  document.title=(newCount()?`(${newCount()}) `:'')+'Swurl Kurl Store';
  render();
}
const newCount=()=>A.appts.filter(x=>x.status==='new').length+A.orders.filter(x=>x.status==='new').length;
function subscribe(){
  if(channel)sb.removeChannel(channel);
  channel=sb.channel('owner-live')
   .on('postgres_changes',{event:'INSERT',schema:'public',table:'appointments'},p=>{fresh.add(p.new.id);const r=p.new;toast(r.inquiry_type==='training'?'New training inquiry':r.request_type==='booking'?'New booking':'New consultation request',`${r.name}${r.service_name?' · '+r.service_name:''}${r.referred_by?' · from '+r.referred_by:''}`);reloadData()})
   .on('postgres_changes',{event:'INSERT',schema:'public',table:'orders'},p=>{fresh.add(p.new.id);toast('New purchase request',`${p.new.name} · ${money(p.new.total)}${p.new.referred_by?' · from '+p.new.referred_by:''}`);reloadData()})
   .on('postgres_changes',{event:'UPDATE',schema:'public',table:'appointments'},()=>reloadData())
   .on('postgres_changes',{event:'UPDATE',schema:'public',table:'orders'},()=>reloadData())
   .subscribe();
}

function referralsView(){
  const g=new Map();
  const add=(name,k)=>{const raw=String(name||'').trim();if(!raw)return null;const key=raw.toLowerCase().replace(/\s+/g,' ');if(!g.has(key))g.set(key,{name:raw,req:0,won:0,rev:0,last:null});return g.get(key)};
  const bump=(r,created)=>{r.last=!r.last||created>r.last?created:r.last};
  A.appts.filter(a=>a.referred_by&&a.status!=='cancelled').forEach(a=>{const r=add(a.referred_by);r.req++;bump(r,a.created_at);if(['confirmed','completed'].includes(a.status))r.won++});
  A.orders.filter(o=>o.referred_by&&o.status!=='cancelled').forEach(o=>{const r=add(o.referred_by);r.req++;bump(r,o.created_at);if(['paid','completed'].includes(o.status)){r.won++;r.rev+=Number(o.total)}});
  const rows=[...g.values()].sort((x,y)=>y.won-x.won||y.req-x.req||String(y.last).localeCompare(String(x.last)));
  const intro='<p class="note" style="margin-top:0">Every request or reservation where the customer named a barbershop. Cancelled requests are left out. "Booked / paid" counts confirmed or completed consultations plus paid or completed purchases.</p>';
  if(!rows.length)return intro+'<div class="empty">No barbershop referrals yet. When a customer fills in "Which barbershop referred you?", it shows up here.</div>';
  return intro+rows.map(r=>`<div class="card"><div class="hd"><div><h3>${esc(r.name)}</h3><div class="meta">Last referral ${ago(r.last)}</div></div><div><span class="badge type">${r.req} referred</span></div></div>

/* ---------- CRM: clients, schedule, payments ---------- */
const STAGES=[['lead','New lead'],['contacted','Contacted'],['consult_booked','Consult booked'],['session_1','Session 1'],['session_2','Session 2'],['complete','Complete'],['not_a_fit','Not a fit']];
const STAGE_NAME=Object.fromEntries(STAGES);
const STAGE_IDX=Object.fromEntries(STAGES.map(([k],i)=>[k,i]));
const KINDS=[['consultation','Consultation'],['session_1','Session 1'],['session_2','Session 2'],['touch_up','Touch-up'],['other','Other']];
const KIND_NAME=Object.fromEntries(KINDS);
const VSTAT={scheduled:'Scheduled',completed:'Completed',cancelled:'Cancelled',no_show:'No-show'};
const METHODS=['Cash','Card','Zelle','Cash App','Venmo','Check','Other'];
const DURATIONS=[[30,'30 min'],[45,'45 min'],[60,'1 hour'],[90,'1.5 hours'],[120,'2 hours'],[150,'2.5 hours'],[180,'3 hours'],[240,'4 hours']];
const KIND_DUR={consultation:30,session_1:120,session_2:120,touch_up:60,other:60};
let cl={id:null,q:'',stage:'all'},sch={day:null,month:null,past:false},notesCache={};
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const tFmt=ts=>new Date(ts).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
const dFmt=ts=>new Date(ts).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
const dtFmt=ts=>dFmt(ts)+' · '+tFmt(ts);
const byStart=(a,b)=>new Date(a.starts_at)-new Date(b.starts_at);
const digits=p=>String(p||'').replace(/\D/g,'').slice(-10);
const prettyPhone=p=>{const d=digits(p);return d.length===10?`(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`:(p||'')};
const cById=id=>A.clients.find(c=>c.id===id);
const paidOf=id=>A.payments.filter(p=>p.client_id===id).reduce((s,p)=>s+(p.kind==='refund'?-1:1)*Number(p.amount),0);
const dueOf=c=>c.package_price!=null&&c.package_price!==''?Math.max(0,Number(c.package_price)-paidOf(c.id)):0;
const nextVisit=id=>A.visits.filter(v=>v.client_id===id&&v.status==='scheduled'&&new Date(v.starts_at)>=new Date(Date.now()-3600e3)).sort(byStart)[0];
const followDue=c=>!!c.follow_up_on&&c.follow_up_on<=todayStr()&&!['complete','not_a_fit'].includes(c.stage);
const timeFromPref=p=>({Morning:'10:00',Afternoon:'14:00',Evening:'17:30'}[p]||'10:00');
const opt=(arr,sel)=>arr.map(([k,l])=>`<option value="${esc(k)}" ${k===sel?'selected':''}>${esc(l)}</option>`).join('');

function crmWarn(){return A.crmErr?`<div class="warnbox">The client system isn't switched on yet (the database update is still pending). ${esc(A.crmErr)}</div>`:''}

/* messages (tap-to-text; nothing is sent automatically) */
function visitMsg(v,type){
  const c=cById(v.client_id);const nm=first(c?.name);const kind=(KIND_NAME[v.kind]||'appointment').toLowerCase();
  const when=`${dFmt(v.starts_at)} at ${tFmt(v.starts_at)}`;
  if(type==='remind')return`Hi ${nm}, it's Terrence at Swurl Kurl Studios. Just a reminder about your ${kind} on ${when}. Reply here to confirm, or let me know if you need to change it.`;
  return`Hi ${nm}, it's Terrence at Swurl Kurl Studios. You're confirmed for your ${kind} on ${when}. Reply here if anything changes. Looking forward to seeing you!`;

/* ---------- Today panel ---------- */
function todayPanel(){
  const t=todayStr();
  const vs=A.visits.filter(v=>v.status==='scheduled'&&dkey(new Date(v.starts_at))===t).sort(byStart);
  const fu=A.clients.filter(followDue).sort((a,b)=>a.follow_up_on<b.follow_up_on?-1:1);

  return`<div class="card"><b>Today</b>
   ${vs.map(v=>{const c=cById(v.client_id);return`<div class="row" data-open-client="${v.client_id}"><span class="when">${esc(tFmt(v.starts_at))}</span><span><b>${esc(c?.name||'Client')}</b> · ${esc(KIND_NAME[v.kind]||v.kind)}</span></div>`}).join('')}
   ${fu.map(c=>`<div class="row" data-open-client="${c.id}"><span class="when ${c.follow_up_on<t?'late':''}">${c.follow_up_on<t?'Overdue':'Follow up'}</span><span><b>${esc(c.name)}</b>${c.follow_up_note?' · '+esc(c.follow_up_note):''}</span></div>`).join('')}

/* ---------- Clients ---------- */
function clientCard(c){
  const nv=nextVisit(c.id),due=dueOf(c);
  const bits=[];
  if(nv)bits.push(`<span>Next</span><b>${esc(dtFmt(nv.starts_at))} · ${esc(KIND_NAME[nv.kind]||nv.kind)}</b>`);
  if(c.follow_up_on)bits.push(`<span>Follow up</span><b class="${followDue(c)?'late':''}">${esc(dayLabel(c.follow_up_on))}${c.follow_up_note?' · '+esc(c.follow_up_note):''}</b>`);
  if(c.package_price!=null&&c.package_price!=='')bits.push(`<span>Balance</span><b>${due>0?money(due)+' due of '+money(c.package_price):'Paid in full ('+money(c.package_price)+')'}</b>`);
  if(c.referred_by)bits.push(`<span>Referred by</span><b>${esc(c.referred_by)}</b>`);
  return`<div class="card click" data-open-client="${c.id}">
   <div class="hd"><div><h3>${esc(c.name)}</h3><div class="meta">${esc(prettyPhone(c.phone))}${c.email?' · '+esc(c.email):''}</div></div><span class="badge st-${c.stage}">${esc(STAGE_NAME[c.stage]||c.stage)}</span></div>
   ${bits.length?`<div class="kv">${bits.join('')}</div>`:''}</div>`;
}
function filteredClients(){
  const q=cl.q.trim().toLowerCase(),qd=q.replace(/\D/g,'');
  return A.clients.filter(c=>{
    if(cl.stage==='due'&&!followDue(c))return false;
    if(!['all','due'].includes(cl.stage)&&c.stage!==cl.stage)return false;
    if(!q)return true;
    return (c.name||'').toLowerCase().includes(q)||(c.email||'').toLowerCase().includes(q)||(c.referred_by||'').toLowerCase().includes(q)||(qd.length>=3&&digits(c.phone).includes(qd));
  }).sort((a,b)=>(followDue(b)-followDue(a))||(new Date(b.updated_at)-new Date(a.updated_at)));
}
function clientListHtml(){
  const list=filteredClients();

}
function clientsView(){

function monthGrid(){

  }else if(sch.past){

  }else{

    const overdue=A.visits.filter(v=>v.status==='scheduled'&&new Date(v.starts_at)<now-3600e3).sort(byStart);

async function loadNotes(id){
  const [n,b]=await Promise.all([
    sb.from('client_notes').select('*').eq('client_id',id).order('created_at',{ascending:false}).limit(200),
    sb.from('agent_notes').select('*').eq('client_id',id).order('created_at',{ascending:false}).limit(200)]);
  let all=n.error?[]:n.data;
  if(!b.error&&b.data)all=all.concat(b.data.map(x=>({...x,kind:'bot'})));
  all.sort((x,y)=>new Date(y.created_at)-new Date(x.created_at));
  notesCache[id]=all;
  if(tab==='clients'&&cl.id===id)render();
}
function openClient(id){
  if(!id)return;tab='clients';cl.id=id;history.replaceState(null,'','#clients');
  notesCache[id]=undefined;render();window.scrollTo(0,0);loadNotes(id);
}
async function logEvent(clientId,body,kind){
  const {error}=await sb.from('client_notes').insert({client_id:clientId,kind:kind||'event',body});
  if(!error&&notesCache[clientId]!==undefined)loadNotes(clientId);
}
async function setStage(c,stage,why){
  if(c.stage===stage)return;
  const old=c.stage;
  const {error}=await sb.from('clients').update({stage}).eq('id',c.id);
  if(error)return toast('Not saved',errMsg(error));
  c.stage=stage;
  await logEvent(c.id,`Stage changed: ${STAGE_NAME[old]} → ${STAGE_NAME[stage]}${why?' ('+why+')':''}.`);
  await reloadData();
}
async function bumpStageFor(c,kind){
  const target={consultation:'consult_booked',session_1:'session_1',session_2:'session_2'}[kind];
  if(!target||['not_a_fit','complete'].includes(c.stage))return;
  if(STAGE_IDX[target]>STAGE_IDX[c.stage])await setStage(c,target,'appointment scheduled');
}

function openSchedule(o){
  o=o||{};const v=o.visit;
  const cs=[...A.clients].sort((a,b)=>a.name.localeCompare(b.name));
  const startD=v?new Date(v.starts_at):null;
  const date=v?dkey(startD):(o.date||todayStr());
  const time=v?pad(startD.getHours())+':'+pad(startD.getMinutes()):(o.time||'10:00');

const mErr=t=>{const e=$('#mErr');if(e)e.textContent=t||''};

document.addEventListener('submit',async e=>{
  const f=e.target;if(!f.id)return;
  if(f.id==='addClientForm'){
    e.preventDefault();const fd=new FormData(f);const name=String(fd.get('name')||'').trim(),phone=String(fd.get('phone')||'').trim();
    if(name.length<2)return mErr('Add a name.');
    if(digits(phone).length!==10)return mErr('Enter a 10-digit mobile number.');
    const dup=A.clients.find(c=>digits(c.phone)===digits(phone));
    if(dup){closeModal();toast('Already a client',dup.name);return openClient(dup.id)}
    const {data,error}=await sb.from('clients').insert({name,phone,email:String(fd.get('email')||'').trim()||null,referred_by:String(fd.get('referred_by')||'').trim()||null,stage:String(fd.get('stage')||'lead')}).select().single();
    if(error)return mErr(errMsg(error));
    await logEvent(data.id,'Client added manually.');closeModal();await reloadData();openClient(data.id);return;
  }
  if(f.id==='schedForm'){
    e.preventDefault();const fd=new FormData(f);const vid=f.dataset.vid,req=f.dataset.req||null;
    const date=fd.get('date'),time=fd.get('time');
    if(!date||!time)return mErr('Pick a date and time.');
    const when=new Date(date+'T'+time);if(isNaN(when))return mErr('That date or time looks off.');
    const dur=parseInt(fd.get('dur'),10)||60,kind=String(fd.get('kind'));
    let cid=vid?A.visits.find(v=>v.id===vid)?.client_id:String(fd.get('client')||'');
    if(!cid)return mErr('Choose a client.');
    const end=when.getTime()+dur*60000;
    const clash=A.visits.find(v=>v.status==='scheduled'&&v.id!==vid&&new Date(v.starts_at).getTime()<end&&new Date(v.starts_at).getTime()+v.duration_min*60000>when.getTime());
    if(clash&&f.dataset.warned!==String(when.getTime()+'_'+dur)){
      f.dataset.warned=String(when.getTime()+'_'+dur);
      mErr(`Heads up: this overlaps ${cById(clash.client_id)?.name||'another appointment'} at ${tFmt(clash.starts_at)}. Tap again to schedule anyway.`);
      $('#schedGo').textContent='Schedule anyway';return;
    }
    const btn=$('#schedGo');btn.disabled=true;
    if(cid==='__new'){
      const name=String(fd.get('newname')||'').trim(),phone=String(fd.get('newphone')||'').trim();
      if(name.length<2||digits(phone).length!==10){btn.disabled=false;return mErr('Add the new client’s name and 10-digit mobile.')}
      const ex=A.clients.find(c=>digits(c.phone)===digits(phone));
      if(ex)cid=ex.id;else{
        const {data,error}=await sb.from('clients').insert({name,phone,stage:'lead'}).select().single();
        if(error){btn.disabled=false;return mErr(errMsg(error))}
        cid=data.id;await logEvent(cid,'Client added while scheduling.');}
    }
    const row={client_id:cid,kind,starts_at:when.toISOString(),duration_min:dur,notes:String(fd.get('notes')||'').trim()||null};
    let error;
    if(vid){({error}=await sb.from('visits').update({kind:row.kind,starts_at:row.starts_at,duration_min:row.duration_min,notes:row.notes}).eq('id',vid))}
    else{({error}=await sb.from('visits').insert({...row,request_id:req||null}))}
    if(error){btn.disabled=false;return mErr(errMsg(error))}
    await logEvent(cid,`${vid?'Rescheduled':'Scheduled'}: ${KIND_NAME[kind]} on ${dtFmt(row.starts_at)}.`);
    if(req){await sb.from('appointments').update({status:'confirmed'}).eq('id',req).eq('status','new')}
    await reloadData();
    const c=cById(cid);if(c&&!vid)await bumpStageFor(c,kind);
    closeModal();toast(vid?'Rescheduled':'Scheduled',`${c?.name||''} · ${dtFmt(row.starts_at)}`);
    return;
  }
  if(f.id==='payForm'){
    e.preventDefault();const fd=new FormData(f);const amount=Number(fd.get('amount'));const cid=f.dataset.cid;
    if(!(amount>0))return mErr('Enter an amount greater than zero.');
    const row={client_id:cid,kind:String(fd.get('kind')),amount:Math.round(amount*100)/100,method:String(fd.get('method')||'')||null,paid_on:String(fd.get('paid_on')||todayStr()),note:String(fd.get('note')||'').trim()||null};
    const {error}=await sb.from('payments').insert(row);
    if(error)return mErr(errMsg(error));
    await logEvent(cid,`${row.kind==='refund'?'Refund':row.kind==='deposit'?'Deposit':'Payment'} of ${money(row.amount)}${row.method?' ('+row.method+')':''} recorded.`);
    closeModal();await reloadData();toast('Payment saved',money(row.amount));
  }
});

/* returns true when the click was a CRM action */
async function crmClick(t,e){
  if(t.hasAttribute('data-mclose')){closeModal();return true}
  if(t.dataset.openClient!==undefined&&t.dataset.openClient!==''){e.preventDefault();openClient(t.dataset.openClient);return true}
  if(t.id==='backclients'){cl.id=null;render();return true}
  if(t.dataset.cstage){cl.stage=t.dataset.cstage;render();return true}
  if(t.id==='addclient'){openAddClient();return true}
  if(t.id==='addvisit'){openSchedule({date:sch.day||undefined});return true}
  if(t.dataset.addvisitFor){openSchedule({clientId:t.dataset.addvisitFor});return true}
  if(t.dataset.sview){sch.day=null;sch.past=t.dataset.sview==='past';render();return true}
  if(t.dataset.day!==undefined){sch.day=t.dataset.day||null;sch.past=false;render();return true}
  if(t.dataset.month){const m=sch.month||new Date();sch.month=new Date(m.getFullYear(),m.getMonth()+parseInt(t.dataset.month,10),1);render();return true}
  if(t.id==='addpay'){openPayment(cl.id);return true}
  if(t.id==='addnote'){
    const box=$('#newNote'),body=box.value.trim();if(!body)return true;t.disabled=true;
    const {error}=await sb.from('client_notes').insert({client_id:cl.id,kind:'note',body});
    t.disabled=false;if(error)return toast('Note not saved',errMsg(error)),true;
    box.value='';await loadNotes(cl.id);toast('Note saved');return true}
  if(t.hasAttribute('data-delpay')){
    const row=t.closest('[data-pid]');if(!row||!confirm('Remove this payment record?'))return true;
    const {error}=await sb.from('payments').delete().eq('id',row.dataset.pid);
    if(error)return toast('Not removed',errMsg(error)),true;
    await logEvent(cl.id,'A payment record was removed.');await reloadData();return true}
  if(t.hasAttribute('data-clearfu')){
    const {error}=await sb.from('clients').update({follow_up_on:null,follow_up_note:null}).eq('id',cl.id);
    if(error)return toast('Not saved',errMsg(error)),true;await reloadData();toast('Follow-up cleared');return true}
  if(t.hasAttribute('data-usecomeback')){
    const cm=A.offers.find(o=>o.id==='comeback');if(!cm)return true;
    const {error}=await sb.from('clients').update({package_name:cm.name,package_price:cm.price}).eq('id',cl.id);
    if(error)return toast('Not saved',errMsg(error)),true;await reloadData();return true}
  if(t.hasAttribute('data-savecl')){
    const c=cById(cl.id);if(!c)return true;const g=k=>document.querySelector(`[data-cf="${k}"]`).value.trim();
    const name=g('name'),phone=g('phone');
    if(name.length<2)return toast('Add a name'),true;
    if(phone&&digits(phone).length!==10)return toast('Check the mobile number','It needs 10 digits.'),true;
    const price=g('package_price');
    const rec={name,phone:phone||null,email:g('email')||null,referred_by:g('referred_by')||null,package_name:g('package_name')||null,package_price:price===''?null:Number(price),follow_up_on:g('follow_up_on')||null,follow_up_note:g('follow_up_note')||null};
    const {error}=await sb.from('clients').update(rec).eq('id',c.id);
    if(error)return toast('Not saved',/duplicate|unique/i.test(errMsg(error))?'Another client already has that phone number.':errMsg(error)),true;
    await reloadData();toast('Saved');return true}
  if(t.hasAttribute('data-vedit')){const v=A.visits.find(x=>x.id===t.closest('[data-vid]')?.dataset.vid);if(v)openSchedule({visit:v});return true}
  if(t.dataset.vstat){
    const v=A.visits.find(x=>x.id===t.closest('[data-vid]')?.dataset.vid);if(!v)return true;
    const s=t.dataset.vstat;
    if(s==='cancelled'&&!confirm('Cancel this appointment?'))return true;
    const {error}=await sb.from('visits').update({status:s}).eq('id',v.id);
    if(error)return toast('Not saved',errMsg(error)),true;
    const c=cById(v.client_id);
    await logEvent(v.client_id,`${KIND_NAME[v.kind]} on ${dtFmt(v.starts_at)} marked ${VSTAT[s].toLowerCase()}.`);
    await reloadData();
    if(c&&s==='completed'&&v.kind==='session_2')await setStage(c,'complete','second session completed');
    return true}
  if(t.dataset.reqSched){
    const a=A.appts.find(x=>x.id===t.dataset.reqSched);if(!a)return true;
    openSchedule({clientId:a.client_id,requestId:a.id,date:a.preferred_date||undefined,time:timeFromPref(a.preferred_time),kind:a.request_type==='booking'?'session_1':'consultation'});return true}
  if(t.dataset.reqClient){
    const a=[...A.appts,...A.orders].find(x=>x.id===t.dataset.reqClient);if(!a)return true;t.disabled=true;
    const dup=A.clients.find(c=>digits(c.phone)===digits(a.phone));
    let cid=dup?.id;
    if(!cid){const {data,error}=await sb.from('clients').insert({name:a.name,phone:a.phone,email:a.email||null,referred_by:a.referred_by||null,stage:'lead'}).select().single();
      if(error){t.disabled=false;return toast('Not added',errMsg(error)),true}cid=data.id;await logEvent(cid,'Added from request '+a.code+'.')}
    await sb.from(t.dataset.reqTable).update({client_id:cid}).eq('id',a.id);
    await reloadData();openClient(cid);return true}
  return false;
}

async function saveService(card){
  const g=f=>card.querySelector(`[data-f="${f}"]`);
  const options=[];
  for(const line of g('options').value.split('\n').map(l=>l.trim()).filter(Boolean)){
    const m=line.match(/^(.+?)\s*\|\s*\$?(\d+(?:\.\d+)?)$/);
    if(!m)return toast('Check the duration options','Each line should look like:  1 hour | 70');
    options.push({label:m[1].trim(),price:Number(m[2])});
  }
  const kind=g('kind').value,price=Number(g('price').value||0);
  const rec={name:g('name').value.trim(),description:g('description').value.trim()||null,kind,price:isFinite(price)?price:0,
    regular_price:g('regular_price').value?Number(g('regular_price').value):null,options,sort:parseInt(g('sort').value||'0',10)||0,active:g('active').checked};
  if(!rec.name)return toast('Add a name');
  if(kind==='book'&&!options.length&&!(rec.price>0))return toast('Add a price','Bookable services need a price or duration options.');
  const {error}=await sb.from('offers').update(rec).eq('id',card.dataset.sid);
  if(error)return toast('Not saved',errMsg(error));
  toast('Service saved','The website will show it right away.');reloadData();
}
async function addService(){
  const name=prompt('Name of the new service?');if(!name||!name.trim())return;
  const id=name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||('svc-'+Date.now());
  const {error}=await sb.from('offers').insert({id,name:name.trim(),kind:'consult',price:0,category:'general',options:[],sort:(A.offers.reduce((m,o)=>Math.max(m,o.sort),0)+1),active:false,description:'Schedule a consultation to talk through your goals and next steps.'});
  if(error)return toast('Not added',errMsg(error));
  toast('Service added','It is hidden until you tick "Show on the website" and save.');reloadData();
}

   <div style="margin-top:10px">${HOOK_EVENTS.map(([k,l])=>`<label style="display:block;margin:4px 0"><input type="checkbox" data-hev="${k}" ${evs.includes(k)?'checked':''}> ${l}</label>`).join('')}</div>
   <label style="display:block;margin:10px 0 0"><input type="checkbox" id="hookOn" ${w.enabled?'checked':''}> Send these to the bot</label>
   ${w.secret?`<div class="note" style="margin-top:10px">Signing secret (paste into the bot so it can check messages):</div><div class="mono" id="hookSecretBox">&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;</div><div class="acts"><button class="btn ghost sm" id="copysecret">Copy secret</button> <button class="btn ghost sm" id="newsecret">Make a new secret</button></div>`:'<div class="note" style="margin-top:10px">A signing secret is made when you save.</div>'}
   <div class="acts"><button class="btn sm" id="savehook">Save webhook</button> <button class="btn ghost sm" id="testhook" ${w.url&&w.secret?'':'disabled'}>Send a test</button></div>
   ${w.last_at?`<div class="note" style="margin-top:8px">Last send: ${esc(ago(w.last_at))} &middot; ${w.last_error?`<b style="color:#8a2a1f">${esc(w.last_error)}</b>`:'delivered'}</div>`:''}</div>`;
}
async function botClick(t,e){
  if(t.id==='copyapi'){copyText(AGENT_API,'Address copied');return true}
  if(t.id==='copyguide'){copyText(botGuideText(),'Instructions copied');return true}
  if(t.id==='copykey'){copyText(freshKey,'Key copied');return true}
  if(t.id==='donekey'){freshKey=null;render();return true}
  if(t.id==='mkkey'){
    const label=($('#keyLabel').value||'').trim();if(!label){toast('Name the key','e.g. Grok CLOSER');return true}
    t.disabled=true;
    const key='skb_'+randHex(32);
    const {error}=await sb.from('agent_keys').insert({label,key_prefix:key.slice(0,10),key_hash:await sha256hex(key)});
    if(error){t.disabled=false;toast('Key not created',errMsg(error));return true}
    freshKey=key;await reloadData();window.scrollTo(0,0);return true}
  if(t.dataset.revokekey){
    if(!confirm('Revoke this key? The bot loses access immediately and can\'t get it back.'))return true;
    const {error}=await sb.from('agent_keys').update({revoked_at:new Date().toISOString()}).eq('id',t.dataset.revokekey);
    if(error){toast('Not revoked',errMsg(error));return true}
    toast('Key revoked','That bot can no longer connect.');reloadData();return true}
  if(t.id==='copysecret'){copyText((A.agentHook||{}).secret||'','Secret copied');return true}
  if(t.id==='newsecret'){
    if(!confirm('Make a new signing secret? Update it in the bot too, or it will reject our messages.'))return true;
    const {error}=await sb.from('agent_webhook').update({secret:randHex(32)}).eq('id',1);
    if(error)toast('Not changed',errMsg(error));else{toast('New secret made','Copy it into the bot.');reloadData()}return true}
  if(t.id==='savehook'){
    const url=($('#hookUrl').value||'').trim();
    if(url){let ok=false;try{const u=new URL(url);ok=u.protocol==='https:'}catch(_){}
      if(!ok){toast('Check the address','It must start with https://');return true}}
    const events=[...document.querySelectorAll('[data-hev]')].filter(x=>x.checked).map(x=>x.dataset.hev);
    const on=$('#hookOn').checked&&!!url;
    if($('#hookOn').checked&&!url)toast('Add the bot\'s address first','Sending stays off until there is one.');
    const w=A.agentHook||{};
    const {error}=await sb.from('agent_webhook').update({url:url||null,events,enabled:on,secret:w.secret||(url?randHex(32):null)}).eq('id',1);
    if(error){toast('Not saved',errMsg(error));return true}
    toast('Webhook saved',on?'New events will be sent to the bot.':'Sending is off.');reloadData();return true}
  if(t.id==='testhook'){
    if(hookBusy)return true;hookBusy=true;t.disabled=true;t.textContent='Sending…';
    try{
      const {data:{session}}=await sb.auth.getSession();
      const r=await fetch(AGENT_API+'/webhook-test',{method:'POST',headers:{'Content-Type':'application/json','apikey':CFG.KEY,'Authorization':'Bearer '+session.access_token},body:'{}'});
      const j=await r.json().catch(()=>({}));
      if(j.ok)toast('Test delivered','The bot answered with status '+j.status+'.');
      else toast('Test failed',j.error||('Status '+(j.status||r.status)));
    }catch(_){toast('Test failed','Check your connection and try again.')}
    hookBusy=false;reloadData();return true}
  return false;
}

/* ---------- boot ---------- */
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){user=null;return vAuth('in')}
  user=session.user;
  const {data:ok,error}=await sb.rpc('is_admin');
  if(error||!ok)return vClaim();
  $('#signout').hidden=false;
  syncPush().then(refreshPush);
  try{await reloadData();subscribe()}catch(e){V().innerHTML=`<div class="wrap loading">Couldn't load the store. ${esc(errMsg(e))}</div>`}
}
sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'){user=null;vAuth('newpw')}else if(ev==='SIGNED_IN'&&!user)boot()});
window.addEventListener('hashchange',()=>{const h=location.hash.replace('#','');if(['appointments','schedule','clients','purchases','referrals','subscribers','bot','services'].includes(h)&&h!==tab){tab=h;if(h!=='clients')cl.id=null;render()}});
setInterval(()=>{if(user&&document.visibilityState==='visible'&&!document.activeElement?.matches?.('textarea,input,select'))render()},60000);
boot();
</script>
